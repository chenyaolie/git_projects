<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直接充值 - 餐费管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #165DFF;
            --primary-dark: #0E42D2;
            --success: #00B42A;
            --danger: #F53F3F;
            --bg-page: #F5F7FA;
            --bg-card: #FFFFFF;
            --border: #E5E6EB;
            --text-primary: #1D2129;
            --text-secondary: #4E5969;
        }
        
        body {
            background-color: var(--bg-page);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
        }
        
        .top-nav {
            background: var(--primary);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(22, 93, 255, 0.2);
        }
        
        .top-nav-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .content-area {
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .dashboard-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }
        
        .card-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 24px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.1);
        }
        
        .btn-primary-custom {
            background: var(--primary);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 14px;
            color: white;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-primary-custom:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.3);
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
            margin-top: 16px;
        }
        
        .back-btn:hover {
            color: var(--primary);
        }
        
        .alert-success-custom {
            background: rgba(0, 180, 42, 0.1);
            color: var(--success);
            border: 1px solid rgba(0, 180, 42, 0.2);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        
        .info-box {
            background: rgba(22, 93, 255, 0.05);
            border: 1px solid rgba(22, 93, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .info-item:last-child {
            margin-bottom: 0;
        }
        
        .info-label {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .info-value {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
        }
        
        .info-value.balance {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="top-nav-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                <path d="M12.5 16a3.5 3.5 0 0 1-.886-6.89L7 11V1a1 1 0 0 0-2 0v10l-4.614-1.89a3.5 3.5 0 1 1 1.228-6.599l1.163.477 1.163-.477a3.5 3.5 0 1 1 3.477 6.89L9 11v5h3.5z"/>
            </svg>
            <span>餐费管理系统 - 直接充值</span>
        </div>
    </div>

    <div class="content-area">
        <div class="dashboard-card">
            <div th:if="${success}" class="alert-success-custom">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.02L4.324 8.384a.75.75 0 1 0 1.06 1.06l2.094 2.093 3.473-4.425a.75.75 0 0 0 .02-1.08z"/>
                </svg>
                <span th:text="${success}"></span>
            </div>
            
            <h2 class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8.5 4.5a.5.5 0 0 0-1 0v5H4a.5.5 0 0 0 0 1h3.5V13a.5.5 0 0 0 1 0V10.5H13a.5.5 0 0 0 0-1H8.5V4.5z"/>
                </svg>
                直接充值
            </h2>
            
            <form th:action="@{/admin/recharge/direct/search}" method="post">
                <input type="hidden" name="adminId" th:value="${adminId}">
                
                <div class="form-group">
                    <label class="form-label">学生学号</label>
                    <input type="text" name="studentId" class="form-input" required>
                </div>
                
                <button type="submit" class="btn-primary-custom">查询学生</button>
            </form>
        </div>
        
        <div class="dashboard-card" th:if="${student}">
            <div class="info-box">
                <div class="info-item">
                    <span class="info-label">学生姓名</span>
                    <span class="info-value">[[${student.studentName}]]</span>
                </div>
                <div class="info-item">
                    <span class="info-label">学号</span>
                    <span class="info-value">[[${student.studentId}]]</span>
                </div>
                <div class="info-item">
                    <span class="info-label">院系</span>
                    <span class="info-value">[[${student.department}]]</span>
                </div>
                <div class="info-item">
                    <span class="info-label">当前余额</span>
                    <span class="info-value balance">¥[[${student.balance}]]</span>
                </div>
            </div>
            
            <form th:action="@{/admin/recharge/direct/confirm}" method="post">
                <input type="hidden" name="adminId" th:value="${adminId}">
                <input type="hidden" name="studentId" th:value="${student.studentId}">
                
                <div class="form-group">
                    <label class="form-label">充值金额</label>
                    <input type="number" name="amount" step="1" min="1" class="form-input" required>
                </div>
                
                <button type="submit" class="btn-primary-custom">确认充值</button>
            </form>
        </div>
        
        <a th:href="@{/admin/index(adminId=${adminId})}" class="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M10.146 4.646a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L12.793 8l-2.647-2.646a.5.5 0 0 1 0-.708z"/>
                <path fill-rule="evenodd" d="M2 8a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8z"/>
            </svg>
            返回主页
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

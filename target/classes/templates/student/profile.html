<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 餐费管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #165DFF;
            --primary-dark: #0E42D2;
            --success: #00B42A;
            --danger: #F53F3F;
            --info: #86909C;
            --bg-page: #F5F7FA;
            --bg-card: #FFFFFF;
            --border: #E5E6EB;
            --text-primary: #1D2129;
            --text-secondary: #4E5969;
        }
        
        body {
            background-color: var(--bg-page);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
        }
        
        .top-nav {
            background: var(--primary);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(22, 93, 255, 0.2);
        }
        
        .top-nav-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .content-area {
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .dashboard-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, #4080FF 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 600;
        }
        
        .user-info h2 {
            margin: 0;
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 600;
        }
        
        .user-info p {
            margin: 4px 0 0;
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .info-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .info-value {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .status-normal {
            background: rgba(0, 180, 42, 0.1);
            color: var(--success);
        }
        
        .status-lost {
            background: rgba(245, 63, 63, 0.1);
            color: var(--danger);
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 24px;
        }
        
        .back-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .info-icon {
            width: 18px;
            height: 18px;
            color: var(--info);
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <div class="top-nav">
        <div class="top-nav-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7-3a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm-.464 4.95l.707.707a1 1 0 0 0 1.414-1.414l-.707-.707a1 1 0 0 0-1.414 1.414zm2.12-6.169a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM11 9a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-9 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
            </svg>
            <span>餐费管理系统 - 个人中心</span>
        </div>
    </div>

    <!-- Content Area -->
    <div class="content-area">
        <div class="dashboard-card">
            <div class="card-header">
                <div class="avatar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M12 14a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm-2-4a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-1-9a1 1 0 0 0-1 1v4a1 1 0 1 0 2 0V2a1 1 0 0 0-1-1z"/>
                    </svg>
                </div>
                <div class="user-info">
                    <h2>[[${student.studentName}]]</h2>
                    <p>学号：[[${student.studentId}]]</p>
                </div>
            </div>

            <ul class="info-list">
                <li class="info-item">
                    <span class="info-label">
                        <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                            <path d="M13.5 6a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-8a.5.5 0 0 1 .5-.5h9zm-9-1a.5.5 0 0 0-.5.5v8a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-8a.5.5 0 0 0-.5-.5h-9z"/>
                            <path d="M2 3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2H2V3zm2-1a1 1 0 0 0-1 1v2h10V3a1 1 0 0 0-1-1H4z"/>
                        </svg>
                        学号
                    </span>
                    <span class="info-value">[[${student.studentId}]]</span>
                </li>
                <li class="info-item">
                    <span class="info-label">
                        <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                            <path d="M12 14a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm-2-4a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-1-9a1 1 0 0 0-1 1v4a1 1 0 1 0 2 0V2a1 1 0 0 0-1-1z"/>
                        </svg>
                        姓名
                    </span>
                    <span class="info-value">[[${student.studentName}]]</span>
                </li>
                <li class="info-item">
                    <span class="info-label">
                        <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                            <path d="M14.763.075A.5.5 0 0 1 15 .5v15a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5V14h-1v1.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5V2h1V.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 .263.075zM3 14h4v-1H3v1zm9-9h-4v1h4V5zm-9 7h4v-1H3v1z"/>
                        </svg>
                        院系
                    </span>
                    <span class="info-value">[[${student.department}]]</span>
                </li>
                <li class="info-item">
                    <span class="info-label">
                        <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                            <path d="M11.8 8H8a4.99 4.99 0 0 0-4.38 2.41c-.6.92-.85 1.93-.85 2.95 0 2.21 1.79 4 4 4h8c2.21 0 4-1.79 4-4s-1.79-4-4-4h-.2c-.32 0-.62-.13-.85-.35l-1.4-1.4c-.4-.4-.95-.55-1.45-.35zM12 17c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm0-3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                        </svg>
                        当前余额
                    </span>
                    <span class="info-value" style="color: var(--primary); font-size: 20px; font-weight: 600;">¥ [[${student.balance}]]</span>
                </li>
                <li class="info-item">
                    <span class="info-label">
                        <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                            <path d="M8 16a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm3.5-9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM6.5 11a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1h-3z"/>
                        </svg>
                        账户状态
                    </span>
                    <span class="status-badge" th:class="${student.isLost == 1 ? 'status-lost' : 'status-normal'}">
                        <svg th:if="${student.isLost == 1}" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M7.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.018 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                        </svg>
                        <svg th:else xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M5 3a4 4 0 0 0-4 4v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7a4 4 0 0 0-4-4H5zm3 1a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 1a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
                            <path d="M10 10.793V13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-2.207l5-3.572L10 10.793z"/>
                        </svg>
                        <span th:text="${student.isLost == 1 ? '已挂失' : '正常'}"></span>
                    </span>
                </li>
                <li class="info-item">
                    <span class="info-label">
                        <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                            <path d="M11.5 2a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-4a.5.5 0 0 1 .5-.5h10zm-4 1a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm0 3a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm4-3a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm0 3a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
                            <path d="M3.5 10a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-5a.5.5 0 0 1 .5-.5h2zm9.861 2.385a.5.5 0 0 0-.569-.095l-2.54 1.5a.5.5 0 0 0-.183.569l.94 3.762a.5.5 0 0 0 .928-.27l1.43-4.289a.5.5 0 0 0-.131-.576z"/>
                            <path d="M8.5 10a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-5a.5.5 0 0 1 .5-.5h2zm5 0a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-5a.5.5 0 0 1 .5-.5h2z"/>
                        </svg>
                        创建时间
                    </span>
                    <span class="info-value">[[${student.createTime}]]</span>
                </li>
            </ul>

            <a th:href="@{/student/index(studentId=${student.studentId})}" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M10.146 4.646a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L12.793 8l-2.647-2.646a.5.5 0 0 1 0-.708z"/>
                    <path fill-rule="evenodd" d="M2 8a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8z"/>
                </svg>
                返回主页
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生注册 - 餐费管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #165DFF;
            --primary-dark: #0E42D2;
            --success: #00B42A;
            --danger: #F53F3F;
            --info: #86909C;
            --bg-page: #F5F7FA;
            --bg-card: #FFFFFF;
            --border: #E5E6EB;
            --text-primary: #1D2129;
            --text-secondary: #4E5969;
        }
        
        body {
            background-color: var(--bg-page);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .register-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        
        .register-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border: none;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .register-icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, #4080FF 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 4px 16px rgba(22, 93, 255, 0.3);
        }
        
        .register-title {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .register-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .form-label {
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-control {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.15);
            outline: none;
        }
        
        .btn-primary-custom {
            background: var(--primary);
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 100%;
            color: white;
        }
        
        .btn-primary-custom:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.3);
        }
        
        .register-footer {
            text-align: center;
            margin-top: 24px;
        }
        
        .link-text {
            color: var(--info);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .link-text:hover {
            color: var(--primary);
        }
        
        .error-message {
            background: rgba(245, 63, 63, 0.1);
            border: 1px solid rgba(245, 63, 63, 0.2);
            border-radius: 8px;
            padding: 12px;
            color: var(--danger);
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--primary);
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--info);
            font-size: 16px;
        }
        
        .input-with-icon {
            padding-left: 40px !important;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <a href="/student/login" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
            </svg>
            返回登录
        </a>
        
        <div class="register-card">
            <div class="register-header">
                <div class="register-icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="white" viewBox="0 0 16 16">
                        <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h12zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2z"/>
                        <path d="M8 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
                        <path d="M8 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM10 7.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/>
                    </svg>
                </div>
                <h1 class="register-title">学生注册</h1>
                <p class="register-subtitle">请填写个人信息完成注册</p>
            </div>
            
            <div th:if="${error}" class="error-message">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
                </svg>
                <span th:text="${error}"></span>
            </div>
            
            <form action="/student/register" method="post" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <input type="hidden" name="prevent-autofill" id="prevent-autofill" value="" style="display: none;">
                <div style="display: none;">
                    <input type="text" name="fake-username" autocomplete="username">
                    <input type="password" name="fake-password" autocomplete="current-password">
                </div>
                <div class="mb-4">
                    <label class="form-label">学号 <span style="color: var(--danger);">*</span></label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M13.5 6a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-8a.5.5 0 0 1 .5-.5h9zm-9-1a.5.5 0 0 0-.5.5v8a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-8a.5.5 0 0 0-.5-.5h-9z"/>
                            <path d="M2 3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2H2V3zm2-1a1 1 0 0 0-1 1v2h10V3a1 1 0 0 0-1-1H4z"/>
                        </svg>
                        <input type="text" name="studentId" class="form-control input-with-icon" placeholder="请输入学号" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">姓名 <span style="color: var(--danger);">*</span></label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M12 14a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm-2-4a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-1-9a1 1 0 0 0-1 1v4a1 1 0 1 0 2 0V2a1 1 0 0 0-1-1z"/>
                        </svg>
                        <input type="text" name="studentName" class="form-control input-with-icon" placeholder="请输入姓名" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">院系 <span style="color: var(--danger);">*</span></label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M14.763.075A.5.5 0 0 1 15 .5v15a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5V14h-1v1.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5V2h1V.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 .263.075zM3 14h4v-1H3v1zm9-9h-4v1h4V5zm-9 7h4v-1H3v1z"/>
                        </svg>
                        <input type="text" name="department" class="form-control input-with-icon" placeholder="请输入院系" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">密码 <span style="color: var(--danger);">*</span></label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                        </svg>
                        <input type="password" name="password" class="form-control input-with-icon" placeholder="请输入密码" required autocomplete="new-password">
                    </div>
                </div>
                
                <button type="submit" class="btn-primary-custom">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="margin-right: 8px;">
                        <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0zm-2-6a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
                        <path d="M3 15a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9A.5.5 0 0 1 3 15z"/>
                    </svg>
                    注册
                </button>
            </form>
            
            <div class="register-footer">
                <span class="link-text">已有账号？</span>
                <a href="/student/login" class="link-text">立即登录</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

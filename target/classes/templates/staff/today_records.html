<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当日流水 - 餐费管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #165DFF;
            --primary-dark: #0E42D2;
            --danger: #F53F3F;
            --info: #86909C;
            --bg-page: #F5F7FA;
            --bg-card: #FFFFFF;
            --border: #E5E6EB;
            --text-primary: #1D2129;
            --text-secondary: #4E5969;
        }
        
        body {
            background-color: var(--bg-page);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
        }
        
        .top-nav {
            background: var(--primary);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(22, 93, 255, 0.2);
        }
        
        .top-nav-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .content-area {
            padding: 24px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .dashboard-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .card-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th,
        .data-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        .data-table th {
            background: #F7F8FA;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .data-table tbody tr:hover {
            background: #F5F7FA;
        }
        
        .amount {
            font-weight: 600;
            color: var(--danger);
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .total-section {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            margin-top: 16px;
        }
        
        .total-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .total-amount {
            font-size: 24px;
            font-weight: 700;
            color: var(--danger);
        }
        
        .stats-card {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-item {
            background: linear-gradient(135deg, var(--primary) 0%, #4080FF 100%);
            border-radius: 12px;
            padding: 20px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.3);
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 13px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <div class="top-nav">
        <div class="top-nav-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7-3a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm-.464 4.95l.707.707a1 1 0 0 0 1.414-1.414l-.707-.707a1 1 0 0 0-1.414 1.414zm2.12-6.169a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM11 9a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-9 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
            </svg>
            <span>餐费管理系统 - 当日流水</span>
        </div>
    </div>

    <!-- Content Area -->
    <div class="content-area">
        <div class="dashboard-card">
            <div class="card-header">
                <h2 class="card-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M11.5 2a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-4a.5.5 0 0 1 .5-.5h10zm-4 1a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm0 3a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm4-3a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm0 3a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
                        <path d="M3.5 10a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-5a.5.5 0 0 1 .5-.5h2zm9.861 2.385a.5.5 0 0 0-.569-.095l-2.54 1.5a.5.5 0 0 0-.183.569l.94 3.762a.5.5 0 0 0 .928-.27l1.43-4.289a.5.5 0 0 0-.131-.576z"/>
                        <path d="M8.5 10a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-5a.5.5 0 0 1 .5-.5h2zm5 0a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-5a.5.5 0 0 1 .5-.5h2z"/>
                    </svg>
                    当日流水
                </h2>
                <a th:href="@{/staff/index(staffId=${staffId})}" class="back-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M10.146 4.646a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L12.793 8l-2.647-2.646a.5.5 0 0 1 0-.708z"/>
                        <path fill-rule="evenodd" d="M2 8a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8z"/>
                    </svg>
                    返回主页
                </a>
            </div>

            <!-- Stats Cards -->
            <div class="stats-card">
                <div class="stat-item">
                    <div class="stat-value">[[${recordCount != null ? recordCount : 0}]]</div>
                    <div class="stat-label">交易笔数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">¥[[${totalAmount != null ? totalAmount : '0.00'}]]</div>
                    <div class="stat-label">合计金额</div>
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>消费编号</th>
                            <th>学生学号</th>
                            <th>学生姓名</th>
                            <th>消费金额</th>
                            <th>消费时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="record : ${records}">
                            <td>[[${record.recordId}]]</td>
                            <td>[[${record.studentId}]]</td>
                            <td>[[${record.studentName}]]</td>
                            <td class="amount">-¥ [[${record.amount}]]</td>
                            <td>[[${record.createTime}]]</td>
                        </tr>
                        <tr th:if="${records == null or records.size() == 0}">
                            <td colspan="5" class="no-data">暂无当日流水记录</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

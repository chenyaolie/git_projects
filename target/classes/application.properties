spring.application.name=DiningExpenseManagementSystem

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/JavaEE?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=1004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.hgnu.diningexpensemanagementsystem.entity

# Thymeleaf配置
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# 日志配置
logging.level.com.hgnu.diningexpensemanagementsystem=DEBUG
logging.level.com.hgnu.diningexpensemanagementsystem.mapper=DEBUG

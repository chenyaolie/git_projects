<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷卡消费 - 餐费管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #165DFF;
            --primary-dark: #0E42D2;
            --success: #00B42A;
            --danger: #F53F3F;
            --warning: #FF7D00;
            --info: #86909C;
            --bg-page: #F5F7FA;
            --bg-card: #FFFFFF;
            --border: #E5E6EB;
            --text-primary: #1D2129;
            --text-secondary: #4E5969;
        }
        
        body {
            background-color: var(--bg-page);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
        }
        
        .top-nav {
            background: var(--primary);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(22, 93, 255, 0.2);
        }
        
        .top-nav-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .content-area {
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .dashboard-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }
        
        .card-header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .card-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary) 0%, #4080FF 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.3);
        }
        
        .card-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }
        
        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-control {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.15);
            outline: none;
        }
        
        .btn-primary-custom {
            width: 100%;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary-custom:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.3);
        }
        
        .btn-danger-custom {
            background: var(--danger);
        }
        
        .btn-danger-custom:hover {
            background: #D93636;
        }
        
        .btn-secondary-custom {
            background: var(--bg-page);
            color: var(--text-secondary);
        }
        
        .btn-secondary-custom:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        
        .btn-group {
            display: flex;
            gap: 12px;
        }
        
        .btn-group button {
            flex: 1;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        
        .back-btn:hover {
            color: var(--primary);
        }
        
        .success-message {
            background: rgba(0, 180, 42, 0.1);
            border: 1px solid rgba(0, 180, 42, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--success);
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .error-message {
            background: rgba(245, 63, 63, 0.1);
            border: 1px solid rgba(245, 63, 63, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--danger);
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .student-info {
            background: #F7F8FA;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .info-value {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .status-normal {
            background: rgba(0, 180, 42, 0.1);
            color: var(--success);
        }
        
        .status-lost {
            background: rgba(245, 63, 63, 0.1);
            color: var(--danger);
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <div class="top-nav">
        <div class="top-nav-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7-3a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm-.464 4.95l.707.707a1 1 0 0 0 1.414-1.414l-.707-.707a1 1 0 0 0-1.414 1.414zm2.12-6.169a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM11 9a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-9 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
            </svg>
            <span>餐费管理系统 - 刷卡消费</span>
        </div>
    </div>

    <!-- Content Area -->
    <div class="content-area">
        <div class="dashboard-card">
            <div class="card-header">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                        <path d="M11 7h3a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V5a3 3 0 0 1 6 0v2zM5 9H3v5h2V9zm10 0h-3v5h3V9zM6 4a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm6 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
                    </svg>
                </div>
                <h2 class="card-title">刷卡消费</h2>
            </div>

            <div th:if="${success}" class="success-message">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425z"/>
                </svg>
                <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="error-message">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zM7 9h2v2H7V9zm0-4h2v4H7V5z"/>
                </svg>
                <span th:text="${error}"></span>
            </div>

            <!-- Search Student Form -->
            <form th:action="@{/staff/consume/search}" method="post" th:if="${student == null}">
                <input type="hidden" name="staffId" th:value="${staffId}">
                
                <div class="form-group">
                    <label class="form-label">学生学号 <span style="color: var(--danger);">*</span></label>
                    <input type="text" name="studentId" class="form-control" placeholder="请输入学生学号" required>
                </div>
                
                <button type="submit" class="btn-primary-custom">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                    </svg>
                    查询学生
                </button>
            </form>

            <!-- Student Info and Consume Form -->
            <div th:if="${student != null}">
                <div class="student-info">
                    <div class="info-row">
                        <span class="info-label">学生学号</span>
                        <span class="info-value">[[${student.studentId}]]</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">学生姓名</span>
                        <span class="info-value">[[${student.studentName}]]</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">当前余额</span>
                        <span class="info-value" style="color: var(--primary); font-size: 18px;">¥ [[${student.balance}]]</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">账户状态</span>
                        <span class="status-badge" th:class="${student.isLost == 1 ? 'status-lost' : 'status-normal'}">
                            <svg th:if="${student.isLost == 1}" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M7.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.018 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                            </svg>
                            <svg th:else xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M5 3a4 4 0 0 0-4 4v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7a4 4 0 0 0-4-4H5zm3 1a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 1a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
                                <path d="M10 10.793V13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-2.207l5-3.572L10 10.793z"/>
                            </svg>
                            <span th:text="${student.isLost == 1 ? '已挂失' : '正常'}"></span>
                        </span>
                    </div>
                </div>

                <form th:action="@{/staff/consume/confirm}" method="post">
                    <input type="hidden" name="staffId" th:value="${staffId}">
                    <input type="hidden" name="studentId" th:value="${student.studentId}">
                    
                    <div class="form-group">
                        <label class="form-label">消费金额 <span style="color: var(--danger);">*</span></label>
                        <div style="position: relative;">
                            <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--info);">¥</span>
                            <input type="number" name="amount" class="form-control" step="1" min="1" placeholder="请输入消费金额" required style="padding-left: 32px;">
                        </div>
                    </div>
                    
                    <div class="btn-group">
                        <button type="submit" class="btn-primary-custom">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M7 9h2v4H7V9zm3-5H5v2h5V4z"/>
                            </svg>
                            确认扣款
                        </button>
                        <button type="button" th:onclick="|window.location.href='@{/staff/consume(staffId=${staffId})}'|" class="btn-primary-custom btn-secondary-custom">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 2a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V2zm5 2h-1v3h1V4zm0 4h-1v3h1V8zm-1 4h1v2H8v-2z"/>
                            </svg>
                            取消
                        </button>
                    </div>
                </form>
            </div>

            <a th:href="@{/staff/index(staffId=${staffId})}" class="back-btn" style="margin-top: 16px; display: inline-block;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M10.146 4.646a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L12.793 8l-2.647-2.646a.5.5 0 0 1 0-.708z"/>
                    <path fill-rule="evenodd" d="M2 8a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8z"/>
                </svg>
                返回主页
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
